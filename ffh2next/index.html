<style>
/* Layout: a single phone-width app column, one screen at a time; ESV orange + cream, Cormorant for questions, Hanken for UI, Caveat for kid voice. */
:root{
  --bg:#F3EBDD; --screen:#FFFBF4; --ink:#2B2118; --muted:#7A6A5A; --line:#E8DCC8;
  --orange:#FF851B; --orange-ink:#C45F0E; --orange-soft:#FFE7D1; --new:#2F6F5E; --new-soft:#DCEFE8;
  --display:"Cormorant Garamond", Georgia, serif; --body:"Hanken Grotesk", system-ui, sans-serif; --hand:"Caveat", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15110D;--screen:#221B15;--ink:#F3EADB;--muted:#BBA88F;--line:#3A2F25;--orange:#FF9A45;--orange-ink:#FFB070;--orange-soft:#3D2716;--new:#7FC4B0;--new-soft:#1E3530;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15110D;--screen:#221B15;--ink:#F3EADB;--muted:#BBA88F;--line:#3A2F25;--orange:#FF9A45;--orange-ink:#FFB070;--orange-soft:#3D2716;--new:#7FC4B0;--new-soft:#1E3530;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:16px}
.app{width:100%;max-width:420px;background:var(--screen);border-radius:26px;box-shadow:0 12px 40px rgba(60,40,20,.12);overflow:hidden;overflow:clip;display:flex;flex-direction:column;min-height:min(820px,calc(100vh - 80px))}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.day{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--orange);color:#fff;padding:4px 10px;border-radius:99px;white-space:nowrap}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);width:0;transition:width .35s}
.body{flex:1;display:flex;flex-direction:column;padding:0 16px 18px;gap:14px;min-height:0}
.photo{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:420/400;max-height:36vh;max-height:36svh;width:100%;background:var(--line);flex:none}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hand);font-size:1.6rem;color:var(--muted);background:repeating-linear-gradient(45deg,var(--orange-soft) 0 12px,transparent 12px 24px)}
.toast{position:absolute;left:12px;bottom:12px;background:#fff;color:#2B2118;border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:600;display:flex;gap:6px;align-items:center;opacity:0;transform:translateY(6px);transition:.25s}
.toast.on{opacity:1;transform:none}
.badge{position:absolute;right:12px;top:12px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--new-soft);color:var(--new)}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:1.9rem}
h2{font-size:1.5rem}
.sub{color:var(--muted);font-size:.95rem;margin:0}
.price{font-size:.85rem;font-weight:700;color:var(--orange-ink)}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:auto;position:sticky;bottom:0;z-index:6;background:var(--screen);padding:10px 0 max(10px,env(safe-area-inset-bottom,0px));box-shadow:0 -10px 14px -6px var(--screen)}
button{font:inherit;cursor:pointer;border:none}
.b{padding:13px 14px;border-radius:99px;font-weight:700;font-size:1rem}
.btns .b{white-space:nowrap}
@media (max-height:700px){.photo{max-height:28vh;max-height:28svh}.body{gap:10px}.body h1{font-size:1.6rem}.body .kid{font-size:1.15rem}.body .promise{font-size:.88rem}}
.b.no{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.b.yes{background:var(--orange);color:#fff}
.b.wide{width:100%}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,.chip:focus-visible,.tile:focus-visible,.step button:focus-visible{outline:3px solid var(--orange-ink);outline-offset:2px}
.kid{font-family:var(--hand);font-size:1.35rem;color:var(--orange-ink);line-height:1.1}
.row{display:flex;flex-direction:column;gap:8px}
.label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step{display:flex;align-items:center;gap:14px}
.step button{width:40px;height:40px;border-radius:50%;background:var(--orange-soft);color:var(--orange-ink);font-size:1.3rem;font-weight:700}
.step output{font-size:1.4rem;font-weight:700;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border-radius:14px;overflow:hidden;background:var(--line);aspect-ratio:1;padding:0;border:3px solid transparent}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:.85rem;font-weight:700;text-align:left}
.tile.on{border-color:var(--orange)}
.tile.on::after{content:"✓";position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700}
.scroll{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding-bottom:4px}
.loader{flex:1;display:grid;place-items:center;text-align:center;gap:10px}
.sun{width:70px;height:70px;border-radius:50%;background:var(--orange);margin:0 auto;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.85);opacity:.7}}

/* plan */
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand img{height:30px;width:auto}
.brand .h{font-size:.8rem;font-weight:700;color:var(--orange-ink)}
.persona{font-family:var(--hand);font-size:1.8rem;color:var(--orange-ink);line-height:1}
.pace{background:var(--orange-soft);border-radius:12px;padding:10px 12px;font-size:.88rem}
.dayblk{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.banner{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;display:block;background:var(--line)}
.slot{display:grid;grid-template-columns:48px 1fr;gap:8px;font-size:.9rem}
.slot time{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.slot b{font-weight:700}
.slot .d{display:block;color:var(--muted);font-size:.83rem}
.slot .pp{display:block;color:var(--orange-ink);font-size:.8rem;font-weight:700}
.slot.villa{background:var(--orange-soft);border-radius:10px;padding:8px;margin-inline:-8px}
.yes{color:var(--orange-ink)}
.ntag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--new-soft);color:var(--new);margin:3px 4px 0 0}
.gate{border:1.5px dashed var(--orange);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.gate input{font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--screen);color:var(--ink)}
.locked{filter:blur(5px);pointer-events:none;user-select:none;opacity:.6}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;padding-left:10px;white-space:nowrap}
tr.t td{font-weight:700;border-bottom:none}
.strike{text-decoration:line-through;color:var(--muted)}
.note{font-size:.78rem;color:var(--muted);margin:0}
.restart{font-size:.85rem;color:var(--muted);background:transparent;text-decoration:underline}
.caption{max-width:420px;font-size:.82rem;color:var(--muted);text-align:center;margin:0}
.sunny{position:absolute;right:10px;bottom:10px;width:64px;height:64px;z-index:2}
.bubble{position:absolute;right:76px;bottom:28px;background:#fff;color:#2B2118;font-family:var(--hand);font-size:1.25rem;font-weight:700;padding:4px 10px;border-radius:14px;opacity:0;transform:scale(.6);transition:.18s;z-index:2}
.bubble.on{opacity:1;transform:none}
#bd{transform-origin:50px 90px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.blink{transform-origin:50px 46px;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#bd.jump{animation:jump .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes jump{40%{transform:translateY(-14px) rotate(-6deg)}}
#bd.shake{animation:shake .4s}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.enter{animation:enter .35s cubic-bezier(.3,1.3,.6,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.97)}}
.out-yes{animation:outy .45s ease-in forwards}@keyframes outy{to{transform:translateX(60px) rotate(6deg);opacity:0}}
.out-no{animation:outn .35s ease-in forwards}@keyframes outn{to{transform:translateX(-60px) rotate(-6deg);opacity:0}}
.b:active,.chip:active,.tile:active{transform:scale(.96)}
.mute{margin-left:4px;background:transparent;font-size:1.1rem;min-width:34px;height:34px;border-radius:99px;white-space:nowrap}
.mute.nudge{background:var(--orange);color:#fff;font-size:.78rem;font-weight:700;padding:0 10px;animation:pulse 1.2s ease-in-out infinite}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){#bd,.blink,.enter,.out-yes,.out-no{animation:none!important}}
.brandbar{display:flex;justify-content:center;padding:10px 16px 0}.brandbar img{height:32px;width:auto;display:block}
.prog{padding:6px 16px 6px;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:8px}
.back{background:transparent;color:var(--muted);font-weight:700;font-size:.9rem;padding:4px 2px;min-width:44px;min-height:32px;text-align:left}
.back:disabled{visibility:hidden}
.left{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tray{display:flex;gap:3px;align-items:center;min-width:0}
.tray .arr{font-size:.7rem;font-weight:700;color:#fff;background:var(--new);border-radius:99px;padding:3px 7px;white-space:nowrap}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--line);flex:none;overflow:hidden;display:grid;place-items:center;font-size:.6rem;color:var(--muted);background:var(--screen)}
.dot img,.dot video{width:100%;height:100%;object-fit:cover}
.dot.y{border:2px solid var(--orange)}
.dot.n{border-style:solid;background:var(--line)}
.dot.now{border-color:var(--orange);border-style:solid;box-shadow:0 0 0 3px var(--orange-soft)}
.dot.pop{animation:dpop .5s cubic-bezier(.3,1.6,.6,1)}@keyframes dpop{from{transform:scale(.2)}}
.votes{font-size:.85rem;font-weight:700;color:var(--new);background:var(--new-soft);border-radius:10px;padding:7px 10px;opacity:0;transform:translateY(4px);transition:.25s}
.votes.on{opacity:1;transform:none}
.promise{font-size:.9rem;margin:-10px 0 0;color:var(--ink)}
.intro{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;min-height:min(820px,calc(100vh - 80px));min-height:min(820px,calc(100svh - 80px));background:#2b6f7a url('/play/v2/intro-poster.jpg') center/cover no-repeat}
.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.intro .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 22%,rgba(0,0,0,.18) 45%,rgba(0,0,0,.62) 78%,rgba(0,0,0,.72))}
.intro .in{position:relative;padding:0 24px max(22px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.intro .eyebrow{font-size:.68rem;letter-spacing:.13em;white-space:nowrap;text-transform:uppercase;font-weight:600;opacity:.95}

.intro .ilogo{height:40px;width:auto;align-self:flex-start;margin-bottom:2px;filter:drop-shadow(0 1px 6px rgba(0,0,0,.35))}

.intro ul{list-style:none;margin:2px 0 0;padding:14px 16px;display:flex;flex-direction:column;gap:9px;background:rgba(255,251,244,.14);border:1px solid rgba(255,255,255,.28);border-radius:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.intro li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.93rem;line-height:1.3}
.intro li b{font-weight:700}

@media (max-height:700px){.intro h1,.intro .kids2{font-size:2.1rem}.intro .in{gap:10px}.intro li{font-size:.86rem}}
/* Inside Instagram / Facebook: links open in a sheet that shows only the top third of the page.
   Put the question and the photo at the top so the visible part makes sense; the buttons stay where they
   always are (bottom, under the thumb) on every screen. */
html.inapp .tray{display:none}
html.inapp .body>h1{order:1;margin-top:2px}

html.inapp .intro .kids2{order:4;margin:0}html.inapp .intro .getlbl{order:5}html.inapp .intro ul{order:6}html.inapp .intro .b.yes{order:7}html.inapp .intro .who{order:8}
.proof{display:flex;flex-direction:column;gap:10px}
.pcard{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}

.meter{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}
.meter i{background:var(--orange)} .meter u{background:#F1C99F}
.quote{font-family:var(--display);font-size:1.2rem;font-style:italic;line-height:1.2}
.sig{font-family:var(--hand);font-size:1.3rem;color:var(--orange-ink)}

.howmade{border-left:3px solid var(--new);padding:6px 0 6px 12px;font-size:.86rem}

.cost{display:flex;flex-direction:column;gap:12px}
.pricebox{background:var(--orange-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

async function sendPlan(to){

  try{ await new Promise(r=>setTimeout(r,600)); const blob=await planPdf();
    const r=await fetch('/api/ffh/plan?to='+encodeURIComponent(to)+'&play='+encodeURIComponent(S.playId),{method:'POST',headers:{'Content-Type':'application/pdf'},body:blob});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'failed');
    S.planUrl=j.url; track('plan_sent',{via:j.via}); save();
    set(j.via==='email'?'Sent to '+to+'. Check your inbox (and spam) in a minute.':j.via==='instagram'?'Saved. We\'ll DM it to @'+to.replace(/^@/,'')+' on Instagram within 24 hours (Instagram limits how fast we can message).':'Saved. Use the button below to keep a copy.');
  }catch(e){ track('plan_send_failed',{msg:String(e.message||e).slice(0,80)}); set('We couldn\'t send it just now. Use the button below to save or share it.'); } }

function wirePlanButtons(){

    if(!window.html2canvas||!window.jspdf){ say('Please try again in a moment.'); return; }

    const d=DL||(window.claude?await window.claude.use('downloads'):null);

    // 2) On our site, on phones: the share sheet (WhatsApp, Instagram, Files…)

    // 3) Laptops: a normal download
