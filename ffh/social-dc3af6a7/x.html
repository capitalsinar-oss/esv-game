<!doctype html><meta charset="utf-8"><title>xfer</title><body style="font:16px sans-serif">Sending…<pre id=l></pre><script>
const files=["01-3d-printer","02-water-war","03-cookie-stall","04-treasure-hunt","05-giant-chess","06-costume-closet","07-sand-microscope","08-puppet-show","09-balinese-dance"].map(s=>s+"-story.jpg");
(async()=>{const out={};for(const f of files){const b=await (await fetch(f)).blob();out[f]=b;document.getElementById('l').textContent+=f+" "+b.size+"\n";}
if(window.opener){window.opener.postMessage({ffh:out},"https://business.facebook.com");document.body.append("Sent.");setTimeout(()=>window.close(),500);}else document.body.append("No opener");})();
</script>
